[project]
name = "darupiar"
version = "0.1.0"
description = "دارویار - یادآور دارو"
requires-python = ">=3.10"
dependencies = [
  "flet==0.28.3",   # همان نسخه‌ای که روی ویندوز تست می‌کنید را بگذارید
  "jdatetime",
]

[tool.flet]
product = "دارویار"
org = "ir.darupiar"
company = "Darupiar"

[tool.flet.app]
module = "hello"   # فایل ورودی: app_ui.py

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
