name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet==0.28.3"

      - name: Build APK
        run: flet build apk --yes --verbose

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/apk/*.apk out/Daruyar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daruyar-apk
          path: out/Daruyar.apk
          if-no-files-found: error
